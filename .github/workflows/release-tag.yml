name: Release Tag

# Every merge into main is a release. The tag is `<upstream>_<fork>`: the Cargo.toml version plus
# the integer in release/fork-version. That integer is how many commits this checkout is ahead of
# DEEIX-AI/Winc dev. The commit hook writes it; this workflow only reads it.
# Cargo.toml stays on the upstream version. The workflow then starts the Release workflow, which
# opens a draft release. Publishing the draft is still a human step. A push of a commit that is
# already tagged fails. A manual run with that tag already present does nothing, so a failed
# release can be retried by running the Release workflow on the existing tag.
#
# The tag is pushed with GITHUB_TOKEN, and events raised that way do not start
# other workflows, so they are started explicitly via workflow_dispatch (the
# documented exception).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Pushes are handled one at a time, so a later push sees the tag an earlier one created.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and dispatch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the version tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(node release/common/version.mjs --tag)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "::error::${tag} is already released."
              exit 1
            fi
            echo "${tag} already exists; nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Start release builds for the tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "refs/tags/$RELEASE_TAG"
