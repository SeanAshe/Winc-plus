name: Feature request
description: Propose a product or technical improvement for winc.
title: "[Feature]: "
type: Feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of winc this proposal affects.
      options:
        - Editor
        - Vim mode
        - Syntax highlighting / navigation
        - Formatting
        - Search
        - File tree
        - Preview
        - Git
        - Terminal
        - SSH remote / WSL
        - Interface / themes
        - Settings / shortcuts
        - Command line
        - Performance
        - Install / update
        - Other
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: >-
        The systems the request concerns. Choose "All platforms" unless it concerns only some of
        them; the issue is labeled with the ones chosen.
      multiple: true
      options:
        - All platforms
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The version you use, shown in Settings → About or by running `winc --version`, so the
        request can be checked against what it already does.
      placeholder: "0.1.970"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should it work? Mockups and alternatives you considered are welcome.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit checklist
      description: Duplicate issues are closed in favor of the earlier one.
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request is focused on one feature or improvement.
          required: true
        - label: I described the impact on performance, platforms, or existing behavior where relevant.
          required: true
