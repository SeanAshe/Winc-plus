name: Build setup
description: Verify the source commit and install the release toolchain for one target.

inputs:
  target:
    description: Rust target triple.
    required: true
  source-sha:
    description: Immutable source commit used by this build.
    required: true

runs:
  using: composite
  steps:
    - name: Verify source commit
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: node release/common/source.mjs
    - uses: actions/setup-node@v7
      with:
        node-version: "26.12.1"
        package-manager-cache: false
    # The release compiler is the one rust-toolchain.toml names, so the version is written in one
    # place.
    - name: Read the toolchain version
      id: toolchain
      shell: bash
      run: |
        version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        [[ -n "$version" ]] || { echo "::error::rust-toolchain.toml names no channel"; exit 1; }
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    # Installs the release compiler with the build target. RUSTUP_TOOLCHAIN makes every later
    # `cargo` in the job use it.
    - uses: dtolnay/rust-toolchain@stable
      id: rust
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        targets: ${{ inputs.target }}
    - name: Use the release toolchain for later steps
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.rust.outputs.name }}
      run: echo "RUSTUP_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"
    # No compilation cache: a cache saved by one tag cannot be read by another, so every release
    # builds from scratch.
